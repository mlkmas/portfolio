<!-- hero.component.html with 3D computer -->
<section id="hero" class="hero-container">
  <div class="hero-content">
    <div class="hero-text">
      <div *ngIf="hero as h">
        <h1>{{ h.title }}</h1>
        <p class="hero-subtitle">{{ h.subtitle }}</p>
      </div>

      <div class="hero-buttons">
        <a href="#projects" class="cta-button">View My Work</a>
        <a href="#contact" class="cta-button secondary">Get In Touch</a>
      </div>
    </div>
    <div class="hero-visual">
      <div class="computer-3d">
        <div class="computer-screen">
          <div class="screen-content">
            <span class="code-line">{{ '{' }}</span>
<span class="code-line">&nbsp;&nbsp;"HELLO WORLD",</span>
<span class="code-line">&nbsp;&nbsp;skills: ["Angular", "TypeScript"],</span>
<span class="code-line">&nbsp;&nbsp;passion: "Creating amazing web experiences"</span>
<span class="code-line">{{ '}' }};</span>
          </div>
        </div>
        <div class="computer-base"></div>
        <div class="computer-keyboard"></div>
      </div>
    </div>
  </div>
  <div class="scroll-down">
    <i class="fas fa-chevron-down"></i>
  </div>
</section>
